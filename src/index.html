<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Antártica</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Antártica">
  <meta name="format-detection" content="telephone=no">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .vaso-carga {
      position: relative;
      width: var(--vaso, 34px);
      aspect-ratio: 11 / 14;
      overflow: hidden;
      border-radius: 3px 3px 7px 7px;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
      background: rgba(90, 180, 245, 0.22);
    }
    .vaso-carga::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(#8fd0ff, #5ab4f5 30%, #1e8fe1);
      animation: llenar-vaso 1.5s ease-in-out infinite;
    }
    @keyframes llenar-vaso {
      0% {
        transform: translateY(100%);
        opacity: 1;
      }
      70% {
        transform: translateY(8%);
        opacity: 1;
      }
      85% {
        transform: translateY(8%);
        opacity: 1;
      }
      100% {
        transform: translateY(8%);
        opacity: 0;
      }
    }
    #inicio {
      --vaso: 44px;
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #ffffff;
      transition: opacity 0.35s ease;
    }
    #inicio.oculto {
      opacity: 0;
      pointer-events: none;
    }
    #inicio img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }
    @media (prefers-reduced-motion: reduce) {
      .vaso-carga::after {
        animation-duration: 3s;
      }
    }
  </style>
</head>
<body>
  <div id="inicio" role="status" aria-label="Cargando Antártica">
    <img src="icons/logo-320.webp" alt="" width="180" height="180">
    <div class="vaso-carga"></div>
  </div>
  <app-root></app-root>
</body>
</html>
