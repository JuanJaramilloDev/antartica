<section class="login">
  <a class="volver" routerLink="/" aria-label="Volver">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    Atrás
  </a>

  <div class="cabecera">
    <img class="logo" src="icons/logo-320.webp" alt="Antártica Drinks" width="120" height="120" />
    <h1>Iniciar sesión</h1>
    <p>Ingresa con tu correo y contraseña.</p>
  </div>

  <form class="tarjeta-login" (submit)="ingresar($event)" novalidate>
    <div class="campos">
      <label class="campo-login" for="login-correo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5" />
          <path d="M4 7l8 6 8-6" />
        </svg>
        <input
          id="login-correo"
          type="email"
          inputmode="email"
          placeholder="Correo"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          [value]="correo()"
          (input)="correo.set($any($event.target).value)"
        />
      </label>
      <label class="campo-login" for="login-clave">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
          <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
        </svg>
        <input
          id="login-clave"
          [type]="verClave() ? 'text' : 'password'"
          placeholder="Contraseña"
          autocomplete="current-password"
          [value]="clave()"
          (input)="clave.set($any($event.target).value)"
        />
        <button
          type="button"
          class="ver-clave"
          [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="verClave.set(!verClave())"
        >
          {{ verClave() ? 'Ocultar' : 'Ver' }}
        </button>
      </label>
    </div>

    @if (error()) {
      <div class="aviso-error" role="alert">{{ error() }}</div>
    }

    <button
      type="submit"
      class="boton boton-primario boton-bloque boton-entrar"
      [disabled]="!valido() || entrando()"
    >
      {{ entrando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</section>
